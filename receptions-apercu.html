const unitCost=c=>c.quantity!==null&&c.amount!==null?new Intl.NumberFormat('fr-DZ',{maximumFractionDigits:4}).format(c.amount/100/c.quantity)+' DA / '+c.p.unit.toLowerCase():'Non calculable';
const dirty=()=>mode==='new'&&(!!receipt.supplier||!!receipt.reference||lines.length>0||!!lineDraft||!!headerDraft.supplier||!!headerDraft.reference||headerDraft.date&&headerDraft.date!=='2026-09-16')||supplierEdit!==null&&JSON.stringify(supplierDraft)!==supplierInitial;

function reset(s){scenario=s;suppliers=[{id:sid(1),name:'Distribution Atlas',contactName:'Samir · exemple',phone:'0550 00 00 01',email:'contact@example.com',address:'Zone industrielle · exemple',active:true},{id:sid(2),name:'Boissons Numidie',contactName:'',phone:'0550 00 00 02',email:'',address:'',active:true},{id:sid(3),name:'Comptoir des Hauts Plateaux',contactName:'',phone:'',email:'',address:'',active:false},{id:sid(4),name:'Nouveau partenaire',contactName:'',phone:'',email:'',address:'',active:true}];records=Array.from({length:12},(_,i)=>({id:sid(i+20),reference:'BL-2026-'+String(42-i).padStart(4,'0'),supplierId:suppliers[i%3].id,supplierName:suppliers[i%3].name,date:'2026-09-'+String(16-Math.floor(i/2)).padStart(2,'0'),lines:[{name:products[i%3].name,code:products[i%3].code,unit:products[i%3].unit,q:60+i}]}));if(s==='empty')records=[];if(s==='no-supplier')suppliers.forEach(v=>v.active=false);mode='history';supplierEdit=null;lineDraft=null;lines=[];receipt={};headerDraft={};error='';historyFilters={q:'',supplier:'ALL',page:1};supplierFilters={q:'',status:'ALL',page:1};render()}
function showDialog(title,body,label,fn,mutation=false){lastFocus=document.activeElement;dialogAction={fn,mutation};$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=body;$('#dialog-confirm').textContent=label;$('#modal').hidden=false;$('#main').inert=true;$('.shell').inert=true;$('#dialog-cancel').focus()}
function hideDialog(){if(pending)return;$('#modal').hidden=true;$('#main').inert=false;$('.shell').inert=false;lastFocus?.isConnected&&lastFocus.focus();dialogAction=null}
async function confirmDialog(){if(pending||!dialogAction)return;const a=dialogAction;if(!a.mutation){hideDialog();a.fn();return}pending=true;$('#dialog-confirm').disabled=true;$('#dialog-cancel').disabled=true;$('#dialog-confirm').textContent='Enregistrement…';await new Promise(r=>setTimeout(r,200));pending=false;$('#dialog-confirm').disabled=false;$('#dialog-cancel').disabled=false;hideDialog();if(outcome==='error'){outcome='success';error='Enregistrement impossible. Votre saisie est conservée ; vous pouvez réessayer.';render();$('#form-error')?.focus();return}a.fn()}
function discard(){mode='history';supplierEdit=null;lineDraft=null;lines=[];receipt={};headerDraft={};error=''}

function startReceipt(){guard(()=>{mode='new';receipt={supplier:'',date:'2026-09-16',reference:''};headerDraft={...receipt};headerEditing=true;lines=[];lineDraft=null;nextLine=1;error='';render();$('#receipt-supplier')?.focus()})}

function head(title,sub,action=''){return `<div class="card-head"><div><h2>${title}</h2>${sub?'<p>'+sub+'</p>':''}</div>${action}</div>`}

function historyView(){const rows=records.filter(r=>(historyFilters.supplier==='ALL'||r.supplierId===historyFilters.supplier)&&(!historyFilters.q||[r.reference,r.supplierName,...r.lines.flatMap(l=>[l.name,l.code])].join(' ').toLowerCase().includes(historyFilters.q.toLowerCase())));historyFilters.page=Math.min(historyFilters.page,Math.max(1,Math.ceil(rows.length/10)));const options=[...new Map(records.map(r=>[r.supplierId,r.supplierName])).entries()];return `<div class="section-label"><div><h2>Historique des réceptions</h2><p>Documents enregistrés · du plus récent au plus ancien</p></div></div><section class="card"><form id="history-filters" class="compact-filters" role="search"><div><label for="history-search">Rechercher</label><input id="history-search" type="search" maxlength="100" value="${esc(historyFilters.q)}" placeholder="Référence, fournisseur ou produit"></div><div><label for="history-supplier">Fournisseur de la réception</label><select id="history-supplier"><option value="ALL">Tous les fournisseurs</option>${options.map(([id,name])=>`<option value="${id}" ${id===historyFilters.supplier?'selected':''}>${esc(name)}</option>`).join('')}</select></div><button class="primary" type="submit">Rechercher</button></form><div class="count-band"><span>${scenario==='error'?'Résultats indisponibles':rows.length+' réception(s)'}${historyFilters.q?' pour « '+esc(historyFilters.q)+' »':''}</span>${historyFilters.q||historyFilters.supplier!=='ALL'?btn('Réinitialiser','reset-history','quiet'):''}</div>${scenario==='error'?'<div class="body" style="padding-top:22px"><div class="notice red" role="alert">Impossible de charger les réceptions. Les critères sont conservés.</div>'+btn('Réessayer','retry')+'</div>':rows.length?`<table class="table receipt-table"><thead><tr><th style="width:23%">Document fournisseur</th><th style="width:16%">Date de réception</th><th style="width:22%">Fournisseur</th><th style="width:28%">Marchandises reçues</th><th style="width:11%">Accès</th></tr></thead><tbody>${rows.slice((historyFilters.page-1)*10,historyFilters.page*10).map(r=>`<tr><td><a href="/receptions/${r.id}?${new URLSearchParams({retour:historyHref()})}" data-destination class="reference">${esc(r.reference)}</a><small>${r.lines.length} ligne(s) enregistrée(s)</small></td><td><span class="mobile-label">Date de réception</span>${r.date.split('-').reverse().join('/')}</td><td><span class="mobile-label">Fournisseur</span>${esc(r.supplierName)}</td><td class="products">${r.lines.slice(0,2).map(l=>esc(l.name)).join(' · ')}${r.lines.length>2?' · +'+(r.lines.length-2)+' lignes':''}<div class="receipt-lines-read">${r.lines.slice(0,2).map(l=>`<span>${l.q} ${l.unit.toLowerCase()}${l.q>1?'s':''}</span>`).join('')}</div></td><td><a class="compact-link" href="/receptions/${r.id}?${new URLSearchParams({retour:historyHref()})}" data-destination aria-label="Ouvrir ${esc(r.reference)}">Ouvrir →</a></td></tr>`).join('')}</tbody></table>${pagination(rows.length,historyFilters.page,'history')}`:`<div class="no-data"><h3>${historyFilters.q||historyFilters.supplier!=='ALL'?'Aucune réception trouvée':'Aucune réception enregistrée'}</h3><p>${historyFilters.q||historyFilters.supplier!=='ALL'?'Modifiez les critères pour retrouver un document.':'Les réceptions confirmées apparaîtront ici.'}</p></div>`}<div class="list-help">Les quantités restent attachées à chaque produit et unité. Les références et noms affichés proviennent de la réception enregistrée.</div></section>`}
function documentCard(){return `<section class="card ${headerEditing?'editing':''}" id="document-card"><div class="edit-heading"><h2><span class="stepnum">1</span>Document fournisseur</h2>${!headerEditing?btn('Modifier','edit-header'):badge('Saisie en cours','blue')}</div>${headerEditing?`<form id="document-form" novalidate><div class="input-grid"><div><label for="receipt-supplier">Fournisseur actif</label><select id="receipt-supplier"><option value="">Sélectionner un fournisseur</option>${activeSuppliers().map(s=>`<option value="${s.id}" ${s.id===headerDraft.supplier?'selected':''}>${esc(s.name)}</option>`).join('')}</select><p id="receipt-supplier-error" class="error-field"></p></div><div><label for="receipt-date">Date de réception</label><input id="receipt-date" type="date" value="${esc(headerDraft.date)}"><p id="receipt-date-error" class="error-field"></p></div><div><label for="receipt-reference">Référence du document</label><input id="receipt-reference" maxlength="100" value="${esc(headerDraft.reference)}" placeholder="Ex. BL-2026-0042"><p id="receipt-reference-error" class="error-field"></p></div></div>${!activeSuppliers().length?'<div class="body"><div class="notice amber">Aucun fournisseur actif disponible. Un fournisseur actif est nécessaire pour enregistrer la réception.</div></div>':''}<div class="edit-footer"><small>Informations du brouillon</small>${receipt.supplier?btn('Annuler','cancel-header'):''}<button type="submit" class="primary">Valider les informations</button></div></form>`:`<dl class="data-summary"><div><dt>Fournisseur</dt><dd>${esc(suppliers.find(s=>s.id===receipt.supplier)?.name||'Indisponible')}</dd></div><div><dt>Date de réception</dt><dd>${receipt.date.split('-').reverse().join('/')}</dd></div><div><dt>Référence</dt><dd>${esc(receipt.reference)}</dd></div></dl>`}</section>`}

function lineEditor(){const p=productOf(lineDraft);return `<form id="line-form" class="line-editor" novalidate><h3>${editingId?'Modifier la ligne':'Ajouter une ligne'}</h3><div class="line-grid"><div class="full"><label for="line-product">Produit du catalogue</label><select id="line-product"><option value="">Sélectionner un produit</option>${catalogue().map(p=>`<option value="${p.id}" ${p.id===lineDraft.productId?'selected':''}>${p.code} · ${p.name}</option>`).join('')}</select><p id="line-product-error" class="error-field"></p></div><div><label for="line-mode">Mode de saisie</label><select id="line-mode" ${!p?'disabled':''}><option value="DIRECT" ${lineDraft.mode==='DIRECT'?'selected':''}>Quantité directe</option><option value="PACKAGING" ${lineDraft.mode==='PACKAGING'?'selected':''} ${!p?.pack.length?'disabled':''}>Nombre de conditionnements</option></select><p class="line-help">${p&&!p.pack.length?'Aucun conditionnement : saisie directe uniquement.':p?'Unité de base : '+p.unit:'Sélectionnez d’abord un produit.'}</p></div>${lineDraft.mode==='PACKAGING'?`<div><label for="line-pack">Conditionnement</label><select id="line-pack"><option value="">Sélectionner</option>${(p?.pack||[]).map(v=>`<option value="${v.id}" ${v.id===lineDraft.pack?'selected':''}>${v.name} · ${v.q} ${p.unit.toLowerCase()}s</option>`).join('')}</select><p id="line-pack-error" class="error-field"></p></div>`:''}<div><label for="line-qty">${lineDraft.mode==='PACKAGING'?'Nombre de conditionnements':'Quantité en '+(p?p.unit.toLowerCase()+'s':'unités de base')}</label><input id="line-qty" inputmode="numeric" value="${esc(lineDraft.qty)}" ${!p?'disabled':''} placeholder="Ex. 10"><p id="line-qty-error" class="error-field"></p></div><div><label for="line-amount">Montant TTC total de la ligne · DA</label><input id="line-amount" inputmode="decimal" value="${esc(lineDraft.amount)}" placeholder="Ex. 1200,00"><p class="line-help">Le montant de cette ligne, pas un prix unitaire. Zéro est accepté s’il est explicite.</p><p id="line-amount-error" class="error-field"></p></div></div><div id="line-preview" class="preview">${linePreview()}</div><div class="row" style="justify-content:flex-end;margin-top:18px">${btn('Annuler','cancel-line')}<button type="submit" class="primary">Valider la ligne</button></div><p class="line-help">Valider la ligne l’ajoute au brouillon. Le stock ne change qu’à l’enregistrement final.</p></form>`}
function lineSummary(l,i){const c=calculate(l);return `<article class="receipt-line"><div class="line-main"><div><p class="line-label">Ligne ${i+1} · brouillon</p><h3>${esc(c.p.name)}</h3><small>${c.p.code}${l.mode==='PACKAGING'?' · '+l.qty+' × '+esc(c.p.pack.find(v=>v.id===l.pack)?.name):' · Saisie directe'}</small></div><div class="line-actions">${btn('Modifier','edit-line:'+l.id,'quiet',!!lineDraft)}${btn('Retirer','remove-line:'+l.id,'quiet danger',!!lineDraft)}</div></div><dl class="line-values"><div><dt>Quantité reçue</dt><dd>${c.quantity} ${c.p.unit.toLowerCase()}s</dd></div><div><dt>Montant TTC de ligne</dt><dd>${money(c.amount)}</dd></div><div><dt>Coût unitaire TTC</dt><dd>${unitCost(c)}</dd></div></dl></article>`}
function totals(){const sum=lines.reduce((a,l)=>a+calculate(l).amount,0),units=new Map();lines.forEach(l=>{const c=calculate(l);units.set(c.p.unit,(units.get(c.p.unit)||0)+c.quantity)});return{sum,units}}
function receiptView(){const t=totals();return `<div class="draft-meta">${btn('← Historique','back-history','quiet')}<span class="badge draft">Brouillon non enregistré</span></div><div class="layout"><div class="stack">${documentCard()}<section class="card ${lineDraft?'editing':''}" id="lines-card"><div class="edit-heading"><h2><span class="stepnum">2</span>Marchandises reçues</h2>${btn('+ Ajouter une ligne','add-line','',!!lineDraft||!catalogue().length||lines.length>=100)}</div>${!catalogue().length?'<div class="body" style="padding-top:16px"><div class="notice amber">Aucun produit disponible. Complétez le catalogue avant de préparer les lignes.</div></div>':''}${lines.map((l,i)=>editingId===l.id?lineEditor():lineSummary(l,i)).join('')}${lineDraft&&!editingId?lineEditor():''}${!lines.length&&!lineDraft?'<div class="no-data"><h3>Aucune ligne préparée</h3><p>Ajoutez les produits, leur quantité et le montant TTC de chaque ligne.</p></div>':''}<div class="list-help">Les lignes restent modifiables jusqu’à l’enregistrement de la réception.</div></section>${formError()}</div><aside class="sidebar"><section class="card"><div class="side-total"><p class="eyebrow">Récapitulatif du brouillon</p><h2>Total des lignes validées</h2><p class="amount" id="draft-total">${lines.length?money(t.sum):'—'}</p><p class="mini">${lines.length} ligne(s) validée(s)${lineDraft?' · 1 ligne en cours, non incluse':''}</p><div style="margin-top:18px">${[...t.units].map(([unit,q])=>`<div class="unit-total"><span>${unit}s</span><b>${q}</b></div>`).join('')}</div><p class="mini" style="margin-top:15px">Quantités regroupées par unité, jamais additionnées entre unités différentes.</p></div><div class="final-bar"><p>La confirmation enregistrera la réception et ses entrées de stock. Aucun encaissement ou paiement fournisseur ne sera créé.</p>${btn('Vérifier la réception','confirm-reception','primary')}</div></section><div class="notice">La référence identifie le document fournisseur. Le total ci-dessus est calculé à partir des lignes saisies.</div></aside></div>`}
function startSupplier(id){guard(()=>{supplierEdit=id;const s=suppliers.find(s=>s.id===id);supplierDraft=s?{name:s.name,contactName:s.contactName,phone:s.phone,email:s.email,address:s.address}:{name:'',contactName:'',phone:'',email:'',address:''};supplierInitial=JSON.stringify(supplierDraft);error='';render();$('#supplier-name').focus()})}

function supplierView(){const rows=suppliers.filter(s=>(supplierFilters.status==='ALL'||s.active===(supplierFilters.status==='ACTIVE'))&&[s.name,s.contactName,s.phone,s.email,s.address].join(' ').toLowerCase().includes(supplierFilters.q.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name,'fr'));supplierFilters.page=Math.min(supplierFilters.page,Math.max(1,Math.ceil(rows.length/10)));return `${supplierEdit===null&&error?formError():''}${supplierEdit==='new'?`<section class="card editing supplier-card">${head('Nouveau fournisseur','Seul le nom est obligatoire.')}${supplierForm()}</section>`:''}<div class="section-label"><div><h2>Fournisseurs</h2><p>Coordonnées et disponibilité pour les prochaines réceptions.</p></div></div><section class="card" style="margin-bottom:17px"><form id="supplier-filters" class="compact-filters" role="search"><div><label for="supplier-search">Rechercher</label><input id="supplier-search" type="search" maxlength="100" value="${esc(supplierFilters.q)}" placeholder="Nom, contact ou coordonnées"></div><div><label for="supplier-status">Statut</label><select id="supplier-status">${[['ALL','Tous'],['ACTIVE','Actifs'],['INACTIVE','Désactivés']].map(([v,l])=>`<option value="${v}" ${v===supplierFilters.status?'selected':''}>${l}</option>`).join('')}</select></div><button class="primary" type="submit">Rechercher</button></form><div class="count-band"><span>${rows.length} fournisseur(s)</span>${supplierFilters.q||supplierFilters.status!=='ALL'?btn('Réinitialiser','reset-suppliers','quiet'):''}</div></section>${rows.slice((supplierFilters.page-1)*10,supplierFilters.page*10).map(s=>`<section class="card supplier-card ${supplierEdit===s.id?'editing':''}" id="supplier-card-${s.id}"><div class="supplier-overview"><div><h3>${esc(s.name)}</h3>${badge(s.active?'Actif':'Désactivé',s.active?'green':'')}<p>${s.contactName?'Contact : '+esc(s.contactName):'Contact non renseigné'}</p></div><div><p>${esc(s.phone)||'Téléphone non renseigné'}</p><p>${esc(s.email)||'E-mail non renseigné'}</p>${s.address?`<details><summary>Voir l’adresse</summary><p>${esc(s.address)}</p></details>`:''}</div><div class="actions">${rights().updateSupplier&&supplierEdit!==s.id?btn('Modifier','edit-supplier:'+s.id):''}${rights().removeSupplier&&supplierEdit!==s.id?btn('Retirer','remove-supplier:'+s.id,'quiet danger'):''}</div></div>${supplierEdit===s.id?supplierForm():''}</section>`).join('')||'<section class="card no-data"><h3>Aucun fournisseur trouvé</h3><p>Modifiez les critères de recherche.</p></section>'}${pagination(rows.length,supplierFilters.page,'suppliers')}<p class="small">Un fournisseur déjà utilisé est désactivé lorsqu’il est retiré. Les réceptions conservent leur historique.</p>`}
function render(){if(!rights().receptions)tab='fournisseurs';if(!rights().suppliers)tab='receptions';$('#hero').innerHTML=`<header class="hero"><div><p class="eyebrow">Approvisionnement</p><h1>Réceptions</h1><p class="muted" style="margin-top:7px;font-size:13px">Enregistrez les marchandises reçues et retrouvez vos documents fournisseurs.</p></div>${tab==='receptions'&&rights().receive&&mode==='history'?btn('Nouvelle réception','new-reception','primary'):tab==='fournisseurs'&&rights().createSupplier&&supplierEdit===null?btn('Nouveau fournisseur','new-supplier','primary'):''}</header>`;$('#tabs').innerHTML=[['receptions','Réceptions'],['fournisseurs','Fournisseurs']].filter(([k])=>rights()[k==='receptions'?'receptions':'suppliers']).map(([k,l])=>`<a href="${k==='fournisseurs'?'/receptions?onglet=fournisseurs':historyHref()}" data-tab="${k}" ${tab===k?'aria-current="page"':''}>${l}</a>`).join('');$('#content').innerHTML=tab==='fournisseurs'?supplierView():mode==='new'?receiptView():historyView();$('#scenario').value=scenario;$('#profile').value=profile;$('#outcome').value=outcome;}
function fieldError(id,text){const el=$('#'+id),err=$('#'+id+'-error');if(err)err.textContent=text;if(el){el.setAttribute('aria-invalid',String(!!text));el.setAttribute('aria-describedby',id+'-error')}}
function validateHeader(){let invalid=false;for(const [id,msg]of [['receipt-supplier',activeSuppliers().some(s=>s.id===headerDraft.supplier)?'':'Sélectionnez un fournisseur actif.'],['receipt-date',/^\d{4}-\d{2}-\d{2}$/.test(headerDraft.date)&&!Number.isNaN(Date.parse(headerDraft.date))&&new Date(headerDraft.date).toISOString().slice(0,10)===headerDraft.date?'':'Saisissez une date valide.'],['receipt-reference',headerDraft.reference.trim()?'':'La référence est obligatoire.']]){fieldError(id,msg);invalid||=!!msg}if(invalid){$('[aria-invalid=true]')?.focus();return}receipt={...headerDraft,reference:headerDraft.reference.trim()};headerEditing=false;error='';render()}
function validateLine(){const c=calculate(lineDraft);let invalid=false;for(const [id,msg]of [['line-product',c.p?'':'Choisissez un produit.'],['line-pack',lineDraft.mode==='PACKAGING'&&!c.p?.pack.some(p=>p.id===lineDraft.pack)?'Choisissez un conditionnement valide.':''],['line-qty',c.quantity===null?'Saisissez une quantité entière strictement positive.':''],['line-amount',c.amount===null?'Saisissez un montant TTC positif ou nul, avec deux décimales maximum.':'']]){fieldError(id,msg);invalid||=!!msg}if(invalid){$('[aria-invalid=true]')?.focus();return}if(editingId)lines=lines.map(l=>l.id===editingId?{...lineDraft}:l);else lines.push({...lineDraft});lineDraft=null;editingId=null;error='';render();notify('Ligne validée dans le brouillon. Aucun mouvement de stock enregistré.');}
function confirmReceipt(){if(headerEditing||!receipt.supplier){error='Validez les informations du document avant de confirmer.';render();return}if(lineDraft){error='Validez ou annulez la ligne en cours avant de confirmer la réception.';render();return}if(!lines.length){error='Ajoutez et validez au moins une ligne.';render();return}const t=totals();if(!Number.isSafeInteger(t.sum)||[...t.units.values()].some(q=>!Number.isSafeInteger(q))){error='Le total dépasse la limite numérique autorisée.';render();return}const supplier=suppliers.find(s=>s.id===receipt.supplier);if(!supplier?.active){error='Ce fournisseur n’est plus actif. Sélectionnez un fournisseur disponible.';render();return}showDialog('Enregistrer cette réception ?',`<p><b>${esc(receipt.reference)}</b> · ${esc(supplier.name)}<br>Date : ${receipt.date.split('-').reverse().join('/')}</p><div class="notice"><b>${lines.length} ligne(s) · ${money(t.sum)}</b><br>${[...t.units].map(([u,q])=>q+' '+u.toLowerCase()+'s').join('<br>')}</div><p>Les marchandises seront ajoutées au stock. Les informations du fournisseur, des produits et des conditionnements seront conservées avec la réception.</p><p>L’enregistrement sera définitif. Aucun paiement fournisseur ne sera créé.</p>`,'Enregistrer la réception',()=>{records.unshift({id:sid(records.length+70),reference:receipt.reference,supplierId:supplier.id,supplierName:supplier.name,date:receipt.date,lines:lines.map(l=>{const c=calculate(l);return{name:c.p.name,code:c.p.code,unit:c.p.unit,q:c.quantity}})});discard();render();notify('Réception enregistrée · simulation. Le brouillon est fermé et l’historique actualisé.');},true)}
function validateSupplier(){let invalid=false;for(const name of ['name','contactName','phone','email','address']){const value=supplierDraft[name].trim();const msg=name==='name'&&!value?'Le nom du fournisseur est obligatoire.':name==='name'&&suppliers.some(s=>s.id!==supplierEdit&&s.name.toLowerCase()===value.toLowerCase())?'Un fournisseur porte déjà ce nom.':name==='email'&&value&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)?'Saisissez une adresse e-mail valide.':'';fieldError('supplier-'+name,msg);invalid||=!!msg}if(invalid){$('[aria-invalid=true]')?.focus();return}saveSupplier()}
async function saveSupplier(){if(pending)return;pending=true;$$('#supplier-form input,#supplier-form textarea,#supplier-form button').forEach(e=>e.disabled=true);$('#supplier-form [type=submit]').textContent='Enregistrement…';await new Promise(r=>setTimeout(r,200));pending=false;if(outcome==='error'){outcome='success';error='Enregistrement impossible. Vos valeurs sont conservées.';render();return}const values=Object.fromEntries(Object.entries(supplierDraft).map(([k,v])=>[k,k==='email'?v.trim().toLowerCase():v.trim()]));if(supplierEdit==='new')suppliers.push({id:sid(suppliers.length+10),...values,active:true});else Object.assign(suppliers.find(s=>s.id===supplierEdit),values);supplierEdit=null;error='';render();notify('Fournisseur enregistré. Les réceptions historiques gardent leurs informations d’origine.');}
document.addEventListener('click',e=>{const t=e.target.closest('a,button');if(!t)return;if(t.dataset.tab){e.preventDefault();navigate(t.dataset.tab);return}if(t.hasAttribute('data-nav')){e.preventDefault();guard(()=>{render();notify('Navigation générale simulée.');});return}if(t.hasAttribute('data-destination')){e.preventDefault();$('#destination').hidden=false;$('#destination').textContent=t.getAttribute('href');notify('Dans Syphax, ce lien ouvre la fiche avec le retour vers cet historique.');return}const a=t.dataset.action;if(!a||pending)return;if(a==='new-reception'){startReceipt();return}if(a==='back-history'){guard(()=>render());return}if(a==='edit-header'){headerDraft={...receipt};headerEditing=true;render();$('#receipt-supplier').focus();return}if(a==='cancel-header'){headerDraft={...receipt};headerEditing=false;render();return}if(a==='add-line'){if(lineDraft||!catalogue().length||lines.length>=100)return;lineDraft=freshLine('line'+nextLine++);editingId=null;render();$('#line-product').focus();return}if(a==='cancel-line'){const close=()=>{lineDraft=null;editingId=null;render()};showDialog('Abandonner la saisie de cette ligne ?','<p>La ligne précédemment validée restera inchangée. Une nouvelle ligne non validée ne sera pas ajoutée.</p>','Abandonner la saisie',close);return}if(a.startsWith('edit-line:')){editingId=a.split(':')[1];lineDraft={...lines.find(l=>l.id===editingId)};render();$('#line-product').focus();return}if(a.startsWith('remove-line:')){const id=a.split(':')[1];showDialog('Retirer cette ligne du brouillon ?','<p>Aucun stock n’a encore été enregistré pour ce brouillon.</p>','Retirer la ligne',()=>{lines=lines.filter(l=>l.id!==id);render()});return}if(a==='confirm-reception'){confirmReceipt();return}if(a==='new-supplier'){startSupplier('new');return}if(a.startsWith('edit-supplier:')){startSupplier(a.split(':')[1]);return}if(a==='cancel-supplier'){guard(()=>render());return}if(a.startsWith('remove-supplier:')){const s=suppliers.find(s=>s.id===a.split(':')[1]);guard(()=>{render();showDialog('Retirer le fournisseur ?',`<p><b>${esc(s.name)}</b></p><p>S’il n’est lié à aucune réception, il sera supprimé. S’il appartient à l’historique, il sera désactivé et les réceptions resteront conservées.</p>`,'Retirer le fournisseur',()=>{if(records.some(r=>r.supplierId===s.id)){s.active=false;notify('Fournisseur désactivé. Son historique est conservé.')}else{suppliers=suppliers.filter(v=>v.id!==s.id);notify('Fournisseur supprimé · aucun historique lié dans la simulation.')}render()},true)});return}if(a==='reset-history'){historyFilters={q:'',supplier:'ALL',page:1};syncUrl();render();return}if(a==='reset-suppliers'){guard(()=>{supplierFilters={q:'',status:'ALL',page:1};render()});return}if(a==='retry'){scenario='normal';render();return}if(/^(history|suppliers)-(prev|next)$/.test(a)){const [kind,dir]=a.split('-');guard(()=>{(kind==='history'?historyFilters:supplierFilters).page+=dir==='next'?1:-1;syncUrl();render()})}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='receipt-reference'){headerDraft.reference=t.value}else if(t.id==='receipt-date'){headerDraft.date=t.value}else if(t.id==='line-qty'||t.id==='line-amount'){lineDraft[t.id==='line-qty'?'qty':'amount']=t.value;$('#line-preview').innerHTML=linePreview()}else if(t.dataset.supplierField){supplierDraft[t.dataset.supplierField]=t.value}});
document.addEventListener('change',e=>{const t=e.target;if(pending)return;if(t.id==='receipt-supplier'){headerDraft.supplier=t.value}else if(t.id==='receipt-date'){headerDraft.date=t.value}else if(t.id==='line-product'){const id=lineDraft.id;lineDraft={...freshLine(id),productId:t.value};render();$('#line-mode').focus()}else if(t.id==='line-mode'){lineDraft={...lineDraft,mode:t.value,qty:'',pack:''};render();$('#line-pack,#line-qty').focus()}else if(t.id==='line-pack'){lineDraft.pack=t.value;$('#line-preview').innerHTML=linePreview()}else if(t.id==='scenario'){const s=t.value;t.value=scenario;guard(()=>reset(s))}else if(t.id==='profile'){const p=t.value;t.value=profile;guard(()=>{profile=p;render()})}else if(t.id==='outcome')outcome=t.value});
document.addEventListener('submit',e=>{e.preventDefault();if(pending)return;if(e.target.id==='document-form')validateHeader();if(e.target.id==='line-form')validateLine();if(e.target.id==='supplier-form')validateSupplier();if(e.target.id==='history-filters'){historyFilters={q:$('#history-search').value.trim(),supplier:$('#history-supplier').value,page:1};syncUrl();render()}if(e.target.id==='supplier-filters'){const next={q:$('#supplier-search').value.trim(),status:$('#supplier-status').value,page:1};guard(()=>{supplierFilters=next;render()})}});
$('#dialog-cancel').onclick=hideDialog;$('#dialog-confirm').onclick=confirmDialog;
document.addEventListener('keydown',e=>{if($('#modal').hidden)return;if(e.key==='Escape'){e.preventDefault();hideDialog()}if(e.key==='Tab'){const els=$$('#modal button:not(:disabled)'),first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
window.addEventListener('beforeunload',e=>{if(dirty()||pending){e.preventDefault();e.returnValue=''}});
function readUrl(){const p=new URLSearchParams(location.search);tab=p.get('onglet')==='fournisseurs'?'fournisseurs':'receptions';const raw=Number(p.get('page'));historyFilters={q:(p.get('recherche')||'').slice(0,100),supplier:/^[a-f0-9]{24}$/i.test(p.get('fournisseur')||'')?p.get('fournisseur'):'ALL',page:Number.isSafeInteger(raw)&&raw>0?raw:1}}
window.addEventListener('popstate',()=>guard(()=>{readUrl();render()}));reset('normal');readUrl();render();
</script></body></html>
