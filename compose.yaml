services:
  mongodb:
    image: mongo:7.0
    container_name: syphax-mongodb
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - syphax_mongodb_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet 'mongodb://127.0.0.1:27017/admin?directConnection=true'
          --eval "try { const status = rs.status(); quit(status.ok === 1 && db.hello().isWritablePrimary ? 0 : 1); } catch (error) { if (error.codeName === 'NotYetInitialized') { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}); } quit(1); }"
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  syphax_mongodb_data:
